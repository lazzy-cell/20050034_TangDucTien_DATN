<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Smart Rental</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css" />
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 mb-4">
        <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Smart Rental</h1>
      <p class="text-slate-400 mt-1 text-sm">Cổng quản lý nhà trọ thông minh</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
      <h2 class="text-lg font-semibold text-white mb-6">Đăng nhập</h2>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1.5">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white
                   focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500"
            placeholder="email@example.com"
            autocomplete="username"
          />
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1.5">Mật khẩu</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white
                   focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        <div id="errorBox" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3"></div>

        <button type="submit" id="loginBtn"
          class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold
                 transition disabled:opacity-60 disabled:cursor-not-allowed">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>

  <script src="/static/js/firebase.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
